{% extends "base.html" %}
{% block content %}
<div class="mx-auto max-w-md rounded-xl border border-[#E2E8F0] bg-white p-8 shadow-sm">
  <h1 class="text-2xl font-bold">{{ "Create account" if register_mode else "Welcome back" }}</h1>
  <p class="mt-2 text-sm text-slate-500">Jury-proof security analysis for AI projects.</p>
  <form method="post" class="mt-6 space-y-4">
    {% if register_mode %}<input name="username" placeholder="Username" class="w-full rounded-lg border p-3" required>{% endif %}
    <input name="email" type="email" placeholder="Email" class="w-full rounded-lg border p-3" required>
    <input name="password" type="password" placeholder="Password" class="w-full rounded-lg border p-3" required>
    <button class="w-full rounded-lg bg-[#0F172A] px-4 py-3 font-semibold text-white">{{ "Register" if register_mode else "Login" }}</button>
  </form>
  {% if not register_mode %}<a href="{{ url_for('auth.demo_login') }}" class="mt-4 block text-center text-sm font-medium text-blue-700">Use Demo Login</a>{% endif %}
</div>
{% endblock %}
