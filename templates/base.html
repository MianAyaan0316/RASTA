<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RASTA-SHIELD{% if title %} · {{ title }}{% endif %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = {theme: {extend: {colors: {ink: '#0F172A'}}}}</script>
</head>
<body class="min-h-screen bg-[#F8FAFC] text-[#0F172A]">
  <nav class="border-b border-[#E2E8F0] bg-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">
      <a href="{{ url_for('web.dashboard') }}" class="text-xl font-bold tracking-tight">RASTA-SHIELD</a>
      {% if session.get('user_id') %}<a href="{{ url_for('auth.logout') }}" class="text-sm text-slate-600 hover:text-slate-900">Sign out</a>{% endif %}
    </div>
  </nav>
  <main class="mx-auto max-w-6xl px-6 py-8">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="mb-4 rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 text-amber-900">{{ message }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
